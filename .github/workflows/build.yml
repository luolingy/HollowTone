name: Build GroovyBox

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_android:
        description: 'Android (APK)'
        type: boolean
        default: false
      build_ios:
        description: 'iOS (IPA)'
        type: boolean
        default: false

jobs:
  windows:
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1]
          $parts = $ver.Split('+')
          echo "BUILD_NAME=$($parts[0])" >> $env:GITHUB_ENV
          echo "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Get dependencies
        run: flutter pub get
      - name: Build portable (zip)
        run: |
          flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath groovybox-windows-$env:BUILD_NAME-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-Windows-portable
          path: groovybox-windows-${{ env.BUILD_NAME }}-portable.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC.exe not found' }
          Write-Host "Using ISCC: $iscc"
          (Get-Content setup.iss -Raw) `
            -replace '#define AppVersion "[^"]*"', ('#define AppVersion "' + $env:BUILD_NAME + '"') `
            -replace '#define BuildNumber "[^"]*"', ('#define BuildNumber "' + $env:BUILD_NUMBER + '"') `
            -replace 'OutputBaseFilename=.*', ('OutputBaseFilename=groovybox-windows-' + $env:BUILD_NAME + '-setup') |
            Set-Content setup.iss -Encoding utf8
          & $iscc setup.iss
          Get-ChildItem Installer
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-Windows-installer
          path: Installer/*.exe
          if-no-files-found: error

  linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev libmpv-dev mpv libayatana-appindicator3-dev libmediainfo-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      - run: tar -czf groovybox-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-Linux
          path: groovybox-linux-${{ env.BUILD_NAME }}.tar.gz

  macos:
    if: inputs.build_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      - run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../groovybox-macos-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-macOS
          path: groovybox-macos-${{ env.BUILD_NAME }}.zip

  android:
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          # key.properties must live in android/ (the gradle root project),
          # not android/app/, or the release signing config is never loaded.
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Patch legacy plugin compileSdk
        run: |
          PLUGIN_DIR=$(find ~/.pub-cache -maxdepth 3 -type d -name "flutter_media_metadata-*" | sort | tail -n 1)
          echo "Patching $PLUGIN_DIR"
          sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 35/' "$PLUGIN_DIR/android/build.gradle"
          grep -n "compileSdkVersion 35" "$PLUGIN_DIR/android/build.gradle"
      - name: Build APK
        run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-Android
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Get dependencies
        run: flutter pub get
      - name: Decode certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 -d > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        if: env.IOS_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | \
            xmllint --xpath "string(//key[.='UUID']/following-sibling::string[1])" -)
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "IOS_PROVISIONING_PROFILE_NAME=$UUID" >> $GITHUB_ENV
      - name: Set signing flag
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "HAS_SIGNING=1" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=0" >> $GITHUB_ENV
          fi
      - name: Build IPA (unsigned)
        if: env.HAS_SIGNING == '0'
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/ios/debug-info --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          find build/ios/iphoneos/Runner.app -type f -exec sh -c 'file -b "$1" | grep -q "^Mach-O" && strip -S "$1"' _ {} \; 2>/dev/null || true
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r Runner.ipa Payload/ && cd -
      - name: Build IPA (signed)
        if: env.HAS_SIGNING == '1'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: "Apple Distribution"
        run: flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: groovybox-iOS
          path: build/ios/ipa/*.ipa
